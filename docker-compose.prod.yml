version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: milo-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milo_secret_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-milo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milo_admin} -d ${POSTGRES_DB:-milo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milo-backend-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-milo_admin}:${POSTGRES_PASSWORD:-milo_secret_password_2026}@db:5432/${POSTGRES_DB:-milo_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-milo_admin}:${POSTGRES_PASSWORD:-milo_secret_password_2026}@db:5432/${POSTGRES_DB:-milo_db}
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-groq}
      - WHISPER_CLOUD_MODEL=whisper-large-v3-turbo
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-milo-jwt-production-secret-key-2026}
    volumes:
      - chroma_data:/app/knowledge_base/chroma_db

volumes:
  postgres_data:
  chroma_data:
