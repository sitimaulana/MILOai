<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/Icon logo milo.svg">
    <title>Daftar Akun Baru: MILO English Speaking Practice</title>
    <meta name="description" content="Daftar akun baru di MILO untuk mulai latihan percakapan bahasa Inggris interaktif dengan umpan balik CEFR langsung.">
    <!-- Google Fonts & Dedicated Auth CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css?v=20261119b">
</head>
<body class="auth-body">

    <!-- Main Card Stage -->
    <main class="auth-stage">
        <div class="auth-floating-card">

            <!-- Brand Badge -->
            <div class="auth-brand-center">
                <a href="index.html" class="auth-brand-pill" title="Kembali ke Beranda" aria-label="Kembali ke Beranda MILO">
                    <span class="brand-flower">
                        <img src="assets/Icon logo milo.svg" alt="" width="20" height="20" class="auth-brand-logo">
                    </span>
                    <span class="brand-title-text">MILO</span>
                </a>
            </div>

            <!-- Segmented Mode Tabs -->
            <div class="auth-segmented-tabs" role="tablist" aria-label="Pilihan Autentikasi">
                <button type="button" class="auth-tab-btn" id="tabBtnLogin" role="tab" aria-selected="false" aria-controls="panelLogin">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Masuk</span>
                </button>
                <button type="button" class="auth-tab-btn active" id="tabBtnRegister" role="tab" aria-selected="true" aria-controls="panelRegister">
                    <i class="fa-regular fa-user"></i>
                    <span>Daftar Akun</span>
                </button>
            </div>

            <!-- Dynamic Alert Container -->
            <div id="authAlertContainer" class="auth-alert-box"></div>

            <!-- 1. LOGIN PANEL -->
            <section id="panelLogin" class="auth-form-panel" aria-labelledby="tabBtnLogin">
                <h2 class="auth-card-title">Selamat Datang</h2>
                <p class="auth-card-subtitle">Lanjutkan sesi latihan berbicara bahasa Inggris Anda.</p>

                <form id="loginForm" class="auth-form" style="margin-top: 18px;" novalidate>
                    <div class="form-group">
                        <label for="loginIdentifier" class="form-label">
                            <span>Username atau Email</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon-left" aria-hidden="true"></i>
                            <input
                                type="text"
                                id="loginIdentifier"
                                name="username"
                                class="form-input"
                                placeholder="budi atau budi@email.com"
                                required
                                autocomplete="username"
                                autocapitalize="none"
                                spellcheck="false"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword" class="form-label">
                            <span>Kata Sandi</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon-left" aria-hidden="true"></i>
                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                class="form-input has-right-icon"
                                placeholder="Masukkan kata sandi"
                                required
                                autocomplete="current-password"
                            >
                            <button
                                type="button"
                                class="btn-toggle-password"
                                data-target="loginPassword"
                                aria-label="Tampilkan kata sandi"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btnLoginSubmit" class="btn-auth-submit">
                        <span>Masuk Sekarang</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-switch-footer">
                    <span>Belum memiliki akun?</span>
                    <button type="button" class="auth-switch-trigger" id="switchToRegister">Daftar Akun Baru</button>
                </div>
            </section>

            <!-- 2. REGISTER PANEL -->
            <section id="panelRegister" class="auth-form-panel active" aria-labelledby="tabBtnRegister">
                <h1 class="auth-card-title">Buat Akun MILO</h1>
                <p class="auth-card-subtitle">Daftar untuk menyimpan riwayat sesi dan personalisasi latihan.</p>

                <form id="registerForm" class="auth-form" style="margin-top: 18px;" novalidate>
                    <div class="form-group">
                        <label for="regUsername" class="form-label">
                            <span>Username</span>
                            <span class="form-label-hint">3-30 karakter</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-at input-icon-left" aria-hidden="true"></i>
                            <input
                                type="text"
                                id="regUsername"
                                name="username"
                                class="form-input"
                                placeholder="milolearner"
                                required
                                autocomplete="username"
                                autocapitalize="none"
                                spellcheck="false"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regFullName" class="form-label">
                            <span>Nama Lengkap</span>
                            <span class="form-label-hint">Opsional</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-id-badge input-icon-left" aria-hidden="true"></i>
                            <input
                                type="text"
                                id="regFullName"
                                name="fullName"
                                class="form-input"
                                placeholder="Budi Setiawan"
                                autocomplete="name"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail" class="form-label">
                            <span>Alamat Email</span>
                            <span class="form-label-hint">Opsional</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon-left" aria-hidden="true"></i>
                            <input
                                type="email"
                                id="regEmail"
                                name="email"
                                class="form-input"
                                placeholder="nama@email.com"
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regPassword" class="form-label">
                            <span>Kata Sandi</span>
                            <span class="form-label-hint">Min. 6 karakter</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon-left" aria-hidden="true"></i>
                            <input
                                type="password"
                                id="regPassword"
                                name="password"
                                class="form-input has-right-icon"
                                placeholder="Buat kata sandi aman"
                                required
                                autocomplete="new-password"
                            >
                            <button
                                type="button"
                                class="btn-toggle-password"
                                data-target="regPassword"
                                aria-label="Tampilkan kata sandi"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regConfirmPassword" class="form-label">
                            <span>Konfirmasi Kata Sandi</span>
                        </label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-shield-halved input-icon-left" aria-hidden="true"></i>
                            <input
                                type="password"
                                id="regConfirmPassword"
                                name="confirmPassword"
                                class="form-input has-right-icon"
                                placeholder="Ulangi kata sandi"
                                required
                                autocomplete="new-password"
                            >
                            <button
                                type="button"
                                class="btn-toggle-password"
                                data-target="regConfirmPassword"
                                aria-label="Tampilkan konfirmasi kata sandi"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btnRegisterSubmit" class="btn-auth-submit">
                        <span>Lanjut ke Penentuan Level</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-switch-footer">
                    <span>Sudah memiliki akun?</span>
                    <button type="button" class="auth-switch-trigger" id="switchToLogin">Masuk ke Sini</button>
                </div>
            </section>

        </div>

        <!-- Home Back Link -->
        <div class="auth-home-back">
            <a href="index.html" class="auth-home-link" aria-label="Kembali ke Beranda MILO">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Kembali ke Beranda</span>
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/auth.js?v=20261119b"></script>
</body>
</html>
